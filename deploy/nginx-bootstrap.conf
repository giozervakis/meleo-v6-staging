# Temporary HTTP-only configuration used ONLY to obtain the first Let's Encrypt certificate.
upstream meleo_app {
    least_conn;
    server app1:8787;
    server app2:8787;
    server app3:8787;
}
server {
    listen 80;
    server_name meleo.gr www.meleo.gr;
    location = /nginx-health { access_log off; return 200 'ok\n'; }
    location / { proxy_pass http://meleo_app; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto http; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
}

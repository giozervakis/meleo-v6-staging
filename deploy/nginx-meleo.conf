# MELEO v5.1 — nginx load balancer / TLS termination
upstream meleo_app {
    least_conn;
    server app1:8787 max_fails=3 fail_timeout=15s;
    server app2:8787 max_fails=3 fail_timeout=15s;
    server app3:8787 max_fails=3 fail_timeout=15s;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name meleo.gr www.meleo.gr;

    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok\n';
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://meleo.gr$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name meleo.gr www.meleo.gr;

    ssl_certificate /etc/letsencrypt/live/meleo.gr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/meleo.gr/privkey.pem;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 8m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok\n';
    }

    # SSE endpoint: never buffer the event stream.
    location /api/live {
        proxy_pass http://meleo_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }

    location / {
        proxy_pass http://meleo_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 75s;
        proxy_read_timeout 75s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
    }
}

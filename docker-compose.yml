# MELEO v6.0 — production launch stack
# PostgreSQL + Redis + 3 Node application instances + nginx load balancer.
# First TLS certificate: see PRODUCTION_DEPLOY_v5.3.md before `docker compose up -d`.

x-app-environment: &app-environment
  NODE_ENV: production
  PORT: 8787
  TRUST_PROXY: 1
  DATABASE_URL: postgres://meleo:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/meleo
  DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-8}
  REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379/0
  REDIS_REQUIRED: 1
  REDIS_KEY_PREFIX: "meleo:v60:"
  APP_URL: ${APP_URL:?set APP_URL}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
  STRIPE_PRICE_BASIC: ${STRIPE_PRICE_BASIC}
  STRIPE_PRICE_PREMIUM: ${STRIPE_PRICE_PREMIUM}
  STRIPE_AUTOMATIC_TAX: ${STRIPE_AUTOMATIC_TAX:-0}
  STRIPE_COLLECT_TAX_ID: ${STRIPE_COLLECT_TAX_ID:-1}
  STRIPE_PORTAL_ENABLED: ${STRIPE_PORTAL_ENABLED:-1}
  RESEND_API_KEY: ${RESEND_API_KEY}
  MAIL_FROM: ${MAIL_FROM}
  SUPPORT_EMAIL: ${SUPPORT_EMAIL}
  ADMIN_EMAIL: ${ADMIN_EMAIL}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD}
  LEGAL_COMPANY_NAME: ${LEGAL_COMPANY_NAME}
  LEGAL_VAT_NUMBER: ${LEGAL_VAT_NUMBER}
  LEGAL_ADDRESS: ${LEGAL_ADDRESS}
  DPO_EMAIL: ${DPO_EMAIL}
  TERMS_VERSION: ${TERMS_VERSION:-2026-08-21}
  ADMIN_TOTP_SECRET: ${ADMIN_TOTP_SECRET}
  ADMIN_IP_ALLOWLIST: ${ADMIN_IP_ALLOWLIST:-}
  ADMIN_SESSION_TTL_HOURS: ${ADMIN_SESSION_TTL_HOURS:-8}
  ADMIN_BIND_USER_AGENT: ${ADMIN_BIND_USER_AGENT:-1}
  SENSITIVE_DATA_KEY: ${SENSITIVE_DATA_KEY}
  STORAGE_DRIVER: s3
  S3_ENDPOINT: ${S3_ENDPOINT:?set S3_ENDPOINT}
  S3_REGION: ${S3_REGION:-eu-central-1}
  S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY}
  SIGNED_DOCUMENT_URL_TTL_SECONDS: ${SIGNED_DOCUMENT_URL_TTL_SECONDS:-120}
  GEOCODING_PROVIDER: ${GEOCODING_PROVIDER:-mapbox}
  MAPBOX_TOKEN: ${MAPBOX_TOKEN}
  OBSERVABILITY_TOKEN: ${OBSERVABILITY_TOKEN}
  SLOW_REQUEST_MS: ${SLOW_REQUEST_MS:-1000}

x-app: &app
  build: .
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  environment: *app-environment
  networks:
    - meleo-backend
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: meleo
      POSTGRES_USER: meleo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - meleo-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meleo -d meleo"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - meleo-backend
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["sh", "-c", "exec redis-server --appendonly yes --appendfsync everysec --requirepass \"$$REDIS_PASSWORD\" --maxmemory ${REDIS_MAXMEMORY:-256mb} --maxmemory-policy allkeys-lru"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    volumes:
      - meleo-redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - meleo-backend
    security_opt:
      - no-new-privileges:true

  app1:
    <<: *app
    environment:
      <<: *app-environment
      INSTANCE_ID: app1

  app2:
    <<: *app
    environment:
      <<: *app-environment
      INSTANCE_ID: app2

  app3:
    <<: *app
    environment:
      <<: *app-environment
      INSTANCE_ID: app3


  worker:
    <<: *app
    command: ["node", "server/worker.js"]
    environment:
      <<: *app-environment
      WORKER_ID: worker1
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-5}
      WORKER_POLL_MS: ${WORKER_POLL_MS:-1000}
    healthcheck:
      disable: true

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      app1:
        condition: service_healthy
      app2:
        condition: service_healthy
      app3:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx-meleo.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/nginx-health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
    networks:
      - meleo-backend
    security_opt:
      - no-new-privileges:true

volumes:
  meleo-db:
  meleo-redis:

networks:
  meleo-backend:
    driver: bridge

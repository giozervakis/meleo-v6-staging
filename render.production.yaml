services:

  # ============================================================
  # PRODUCTION REDIS / KEY VALUE
  # ============================================================

  - type: keyvalue
    name: meleo-production-redis
    plan: 256mb
    region: frankfurt
    maxmemoryPolicy: allkeys-lru
    persistenceMode: journal-snapshot
    ipAllowList: []

  # ============================================================
  # PRODUCTION WEB/API
  # ============================================================

  - type: web
    name: meleo-production
    runtime: node
    plan: 0.5c-512mb
    region: frankfurt
    branch: main

    buildCommand: npm ci && npm run build
    startCommand: node server/index.js

    healthCheckPath: /api/ready
    autoDeployTrigger: commit

    envVars:

      # --------------------------------------------------------
      # ENVIRONMENT
      # --------------------------------------------------------

      - key: NODE_ENV
        value: production

      - key: MELEO_DEPLOYMENT_ENV
        value: production

      - key: TRUST_PROXY
        value: "1"

      - key: APP_URL
        sync: false

      # --------------------------------------------------------
      # DATABASE
      # --------------------------------------------------------

      - key: DATABASE_URL
        fromDatabase:
          name: meleo-production-db
          property: connectionString

      - key: DATABASE_POOL_MAX
        value: "10"

      - key: DATABASE_SSL_REJECT_UNAUTHORIZED
        value: "true"

      # --------------------------------------------------------
      # REDIS
      # --------------------------------------------------------

      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: meleo-production-redis
          property: connectionString

      - key: REDIS_REQUIRED
        value: "1"

      - key: REDIS_KEY_PREFIX
        value: "meleo:production:v70:"

      # --------------------------------------------------------
      # STORAGE
      # --------------------------------------------------------

      - key: STORAGE_DRIVER
        value: s3

      - key: S3_ENDPOINT
        sync: false

      - key: S3_BUCKET
        sync: false

      - key: S3_ACCESS_KEY_ID
        sync: false

      - key: S3_SECRET_ACCESS_KEY
        sync: false

      # --------------------------------------------------------
      # SECURITY
      # --------------------------------------------------------

      - key: ADMIN_EMAIL
        value: admin@meleo.gr

      - key: ADMIN_PASSWORD
        sync: false

      - key: ADMIN_TOTP_SECRET
        sync: false

      - key: SENSITIVE_DATA_KEY
        generateValue: true

      - key: OBSERVABILITY_TOKEN
        generateValue: true

      # --------------------------------------------------------
      # STRIPE LIVE
      # --------------------------------------------------------

      - key: PAYMENTS_MODE
        value: stripe

      - key: STRIPE_SECRET_KEY
        sync: false

      - key: STRIPE_WEBHOOK_SECRET
        sync: false

      - key: STRIPE_PRICE_BASIC
        sync: false

      - key: STRIPE_PRICE_PREMIUM
        sync: false

      # --------------------------------------------------------
      # EMAIL
      # --------------------------------------------------------

      - key: RESEND_API_KEY
        sync: false

      - key: MAIL_FROM
        value: "MELEO <no-reply@meleo.gr>"

      - key: SUPPORT_EMAIL
        value: support@meleo.gr

      # --------------------------------------------------------
      # WORKER / OPERATIONS
      # --------------------------------------------------------

      - key: WORKER_CONCURRENCY
        value: "5"

      - key: WORKER_POLL_MS
        value: "1000"

      - key: RETENTION_PURGE_INTERVAL_MS
        value: "86400000"

      - key: STRIPE_RECONCILE_INTERVAL_SECONDS
        value: "3600"

      # --------------------------------------------------------
      # PRODUCTION SAFETY FLAGS
      # --------------------------------------------------------

      - key: E2E_MODE
        value: "0"

      - key: SEED_DEMO
        value: "0"

      - key: DEMO_AUTH
        value: "0"

      - key: DEMO_CHECKOUT
        value: "0"

  # ============================================================
  # PRODUCTION BACKGROUND WORKER
  # ============================================================

  - type: worker
    name: meleo-production-worker
    runtime: node
    plan: 0.5c-512mb
    region: frankfurt
    branch: main

    buildCommand: npm ci
    startCommand: node server/worker.js
    autoDeployTrigger: commit

    envVars:

      - key: NODE_ENV
        value: production

      - key: MELEO_DEPLOYMENT_ENV
        value: production

      - key: APP_URL
        sync: false

      - key: DATABASE_URL
        fromDatabase:
          name: meleo-production-db
          property: connectionString

      - key: DATABASE_POOL_MAX
        value: "5"

      - key: DATABASE_SSL_REJECT_UNAUTHORIZED
        value: "true"

      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: meleo-production-redis
          property: connectionString

      - key: REDIS_REQUIRED
        value: "1"

      - key: REDIS_KEY_PREFIX
        value: "meleo:production:v70:"

      - key: STORAGE_DRIVER
        value: s3

      - key: S3_ENDPOINT
        sync: false

      - key: S3_BUCKET
        sync: false

      - key: S3_ACCESS_KEY_ID
        sync: false

      - key: S3_SECRET_ACCESS_KEY
        sync: false

      - key: ADMIN_EMAIL
        value: admin@meleo.gr

      - key: ADMIN_PASSWORD
        sync: false

      - key: ADMIN_TOTP_SECRET
        sync: false

      - key: SENSITIVE_DATA_KEY
        sync: false

      - key: OBSERVABILITY_TOKEN
        sync: false

      - key: PAYMENTS_MODE
        value: stripe

      - key: STRIPE_SECRET_KEY
        sync: false

      - key: STRIPE_WEBHOOK_SECRET
        sync: false

      - key: STRIPE_PRICE_BASIC
        sync: false

      - key: STRIPE_PRICE_PREMIUM
        sync: false

      - key: RESEND_API_KEY
        sync: false

      - key: MAIL_FROM
        value: "MELEO <no-reply@meleo.gr>"

      - key: SUPPORT_EMAIL
        value: support@meleo.gr

      - key: WORKER_CONCURRENCY
        value: "5"

      - key: WORKER_POLL_MS
        value: "1000"

      - key: RETENTION_PURGE_INTERVAL_MS
        value: "86400000"

      - key: STRIPE_RECONCILE_INTERVAL_SECONDS
        value: "3600"

      - key: E2E_MODE
        value: "0"

      - key: SEED_DEMO
        value: "0"

      - key: DEMO_AUTH
        value: "0"

      - key: DEMO_CHECKOUT
        value: "0"


# ============================================================
# PRODUCTION POSTGRESQL
# ============================================================

databases:

  - name: meleo-production-db
    plan: 0.5c-1g
    region: frankfurt
    postgresMajorVersion: "16"
    databaseName: meleo_production
    user: meleo_production
    diskSizeGB: 10
    ipAllowList: []

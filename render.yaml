services:
  - type: keyvalue
    name: meleo-staging-redis
    plan: free
    region: frankfurt
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

  - type: web
    name: meleo-v6-staging
    runtime: node
    plan: free
    region: frankfurt

    buildCommand: npm ci && npm run build
    startCommand: node scripts/render-staging-start.mjs

    healthCheckPath: /api/health
    autoDeployTrigger: commit

    envVars:
      # --------------------------------------------------
      # STAGING
      # --------------------------------------------------
      - key: NODE_ENV
        value: staging

      - key: TRUST_PROXY
        value: "1"

      # --------------------------------------------------
      # POSTGRESQL
      # --------------------------------------------------
      - key: DATABASE_URL
        fromDatabase:
          name: meleo-staging-db
          property: connectionString

      - key: DATABASE_SSL
        value: "0"

      - key: DATABASE_POOL_MAX
        value: "5"

      # --------------------------------------------------
      # REDIS
      # --------------------------------------------------
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: meleo-staging-redis
          property: connectionString

      - key: REDIS_REQUIRED
        value: "1"

      - key: REDIS_KEY_PREFIX
        value: "meleo:staging:v60:"

      # --------------------------------------------------
      # STORAGE
      # Staging only - encrypted local temporary storage
      # --------------------------------------------------
      - key: STORAGE_DRIVER
        value: local

      # --------------------------------------------------
      # DEMO / STAGING / E2E MODE
      # --------------------------------------------------
      - key: SEED_DEMO
        value: "1"

      - key: DEMO_AUTH
        value: "1"

      - key: DEMO_CHECKOUT
        value: "1"

      - key: PAYMENTS_MODE
        value: demo

      # Allows Playwright staging tests to run without
      # hitting the normal production-grade rate limits.
      # NEVER enable this in production.
      - key: E2E_MODE
        value: "1"
        
      - key: RUN_E2E_RESET_ON_BOOT
        value: "1"

      # --------------------------------------------------
      # STAGING ADMIN
      # --------------------------------------------------
      - key: ADMIN_EMAIL
        value: admin@meleo.gr

      - key: ADMIN_PASSWORD
        generateValue: true

      - key: ADMIN_TOTP_SECRET
        sync: false

      # --------------------------------------------------
      # SECURITY
      # Render generates random values automatically
      # --------------------------------------------------
      - key: SENSITIVE_DATA_KEY
        generateValue: true

      - key: OBSERVABILITY_TOKEN
        generateValue: true

      # --------------------------------------------------
      # BACKGROUND JOBS
      # Worker runs inside staging web service
      # --------------------------------------------------
      - key: WORKER_CONCURRENCY
        value: "2"

      - key: WORKER_POLL_MS
        value: "1500"

      # --------------------------------------------------
      # EMAIL
      # No real email provider required for initial testing
      # --------------------------------------------------
      - key: MAIL_FROM
        value: "MELEO Staging <no-reply@meleo.gr>"

      - key: SUPPORT_EMAIL
        value: support@meleo.gr


databases:
  - name: meleo-staging-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "16"
    databaseName: meleo_staging
    user: meleo_staging
    ipAllowList: []
